name = "discord-mcp"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Service binding to the voices worker — the Mouth's config and judge.
[[services]]
binding = "VOICES"
service = "asher-voices"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
