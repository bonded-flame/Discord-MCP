name = "discord-mcp"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Set to "false" to disable DM notifications when Asher is mentioned/replied to
# MENTION_DMS = "false"

# Secrets (add via wrangler secret put):
# - DISCORD_TOKEN: Your Discord bot token
# - MCP_SECRET: Random string for URL authentication
# - OWNER_DISCORD_ID: Your Discord user ID — receives DMs when bot is mentioned

[triggers]
crons = ["*/5 * * * *"]
